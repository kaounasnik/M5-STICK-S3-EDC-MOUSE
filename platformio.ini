[env:m5sticks3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Required so Bluetooth + M5Unified + media fit in flash memory
board_build.partitions = huge_app.csv

; Auto-detects optional screen.png / screen.gif / screen.svg in src/
extra_scripts = pre:embed_assets.py

; Enables serial logging over the ESP32-S3's native USB-C port
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Libraries
lib_deps =
    https://github.com/m5stack/M5Unified.git
    https://github.com/T-vK/ESP32-BLE-Mouse.git
    bitbank2/AnimatedGIF @ ^2.1.1
    https://github.com/memononen/nanosvg.git